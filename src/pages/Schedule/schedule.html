<ion-header >
  <ion-navbar>
    <!-- <ion-title>home</ion-title> -->
    <button ion-button menuToggle>
      <ion-icon style="color:  #9c4889" name="menu"></ion-icon>
    </button>

    <ion-buttons end>
      <button ion-button style="fill:  #757575"  (click)="get_all_schedule_appointments()">
        <div>
          <svg style="color: #9c4889;" xmlns="http://www.w3.org/2000/svg" width="30" height="20" fill="currentColor"
            class="bi bi-eye" viewBox="0 0 16 16">
            <path
              d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z" />
            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z" />
          </svg>
          <br>
          <label style="color: #9c4889;font-weight: bold;">view</label>
        </div>
      </button>
    </ion-buttons>
  </ion-navbar>
</ion-header>

<ion-content padding class="masters">

  <ion-list style="background-color: #ffffff !important;
    border-radius: 5%;
    border-bottom: 2px solid #a7a7a7;
  ">
    <button ion-button icon-right style="background-color: transparent;border: 0 !important;
    box-shadow: none !important;width: 100%;">
      <div>
        <svg style="color: #9c4889;" xmlns="http://www.w3.org/2000/svg" width="30" height="20" fill="currentColor"
          class="bi bi-eye" viewBox="0 0 16 16">
          <path
            d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z" />
        </svg>
        <br>
      </div>  
      <ion-datetime style="color: #9c4889; font-size: 20px;font-weight: bold;font-family: Hacen Tunisia Lt !important;" (click)="picker.open()" #picker
        displayFormat="DD/MM/YYYY" max="2030" min="2021" pickerFormat="YYYY-MM-DD" [(ngModel)]="event1.startTime"
        (ionChange)="changeDate()">
      </ion-datetime>
    </button>
  </ion-list>


  <div style="width: 100%;height: 100%;padding: 5px;">
    <ion-grid>
      <!-- <ion-col col-12 col-md-6 col-lg-6 col-xl-3>
          <div text-center>
            <ion-card style="text-align: center;">
              <label style="color: #9c4889; font-size: 25px;font-weight: bold;">4:40</label>
              <br>

              <p>MMM</p>
              <p>lolo.steef@gmail.com</p>
              <p>معالجة اثار حب الشباب والندبات</p>
              <p>الدكتور سامي عيسى</p>
            </ion-card>


          </div>
        </ion-col> -->

      <ion-row wrap>

        <ion-col col-12 col-md-6 col-lg-6 col-xl-3 *ngFor="let item of $items; index as i">
          <div text-center>
            <ion-card style="box-shadow: none !important; border: 1 !important;background-image: linear-gradient(to bottom, #fff, #e6e6e6);
            border-left: 1px solid #cacaca;
            border-right: 1px solid #cacaca;
            border-top: 1px solid #cacaca;
            border-bottom: 2px solid #a7a7a7;
           padding-bottom: 5px;
           padding-top: 5px;">
              <label style="color: #9c4889; font-size: 25px;font-weight: bold;">{{item.time}}</label>
              <p style=" font-size: 15px;font-weight: bold;">{{item.date}}</p>
              <p style=" font-size: 15px;font-weight: bold;">{{item.doctor}}</p>
              <p style=" font-size: 15px;font-weight: bold;">{{item.service}}</p>
              <span style=" font-size: 15px;font-weight: bold;">{{item.name}} </span>
              <span style="color: #9c4889; font-size: 25px;font-weight: bold; font-style: italic;"> | </span>
              <span style=" font-size: 15px;font-weight: bold;font-style: italic;">{{item.customer_email}}</span>
            </ion-card>
          </div>
        </ion-col>


      </ion-row>
    </ion-grid>

  </div>

</ion-content>
